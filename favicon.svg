<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <style>
        .main-letter {
            font-family: 'Cormorant Garamond', serif;
            font-size: 75px;
            font-weight: 600;
            fill: #c9a961;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .sub-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 400;
            fill: #c9a961;
            text-anchor: middle;
            letter-spacing: 2px;
        }
    </style>
    <rect width="100" height="100" fill="rgb(15, 39, 68)"/>
    <text x="50" y="48" class="main-letter">G</text>
    <text x="50" y="82" class="sub-text">DUO</text>
</svg>
